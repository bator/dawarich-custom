# Hand-written test cases for the GTFS matcher (Gtfs::MatchCases, rake
# gtfs:match_cases). The rides a user reviewed (confirmed / rejected) are
# cases too; these are the ones the reviews do not say, e.g. a ride whose
# right answer was never posted.
#
# user_id: the Dawarich user; date: the local day matched;
# expect: rides the matcher must find, by line, boarding and alighting stop
#   name (as in the timetable), from / to HH:MM Europe/Budapest, within
#   tolerance_min;
# forbid: rides it must not find (same fields, any time that day unless from/to).
# A day whose points a track_pick pick hid is replayed as it was before the
# pick (Gtfs::MatchCases#replay), so the case tests the GPS, not the pick.
cases:
  - id: gps-dropout-velence-kelenfold
    note: >-
      16 Pro, 2026-10-22: no fix 07:57-08:17 (36.5 km) on the train. The ride
      ended at Velence (ride 133, rejected); with the gap bridge (ce73fe8) it
      runs to Kelenföld.
    user_id: 2
    date: 2026-10-22
    expect:
      - line: '9057'
        board: Székesfehérvár
        alight: Budapest-Kelenföld
        from: '07:41'
        to: '08:24'
        tolerance_min: 5
    forbid:
      - line: '9057'
        board: Székesfehérvár
        alight: Velence
  - id: z30-evening-s22
    note: S22, 2026-10-22, the confirmed Z30 home (ride 131).
    user_id: 7
    date: 2026-10-22
    expect:
      - line: Z30
        board: Budapest-Kelenföld
        alight: Székesfehérvár
        from: '16:11'
        to: '17:09'
        tolerance_min: 8
  - id: g44-standing-at-dinnyes
    note: >-
      16 Pro, 2026-10-23: the G44 home split into two movement windows 21 s
      apart at Dinnyés; the last 11 km were lost and the ride ended at
      Dinnyés (ride 145). It ends at Székesfehérvár (extend_into_next).
    user_id: 2
    date: 2026-10-23
    expect:
      - line: G44
        board: Budapest-Kelenföld
        alight: Székesfehérvár
        from: '22:27'
        to: '23:20'
        tolerance_min: 6
    forbid:
      - line: G44
        board: Budapest-Kelenföld
        alight: Dinnyés
  - id: first-movement-without-stop-9057
    note: >-
      16 Pro, 2026-11-05: only 1-5 km fixes 07:45-08:20 on the train, hidden by
      the 100 m accuracy filter. The first movement ended near Dinnyés, far from
      any stop, so it matched nothing and the gap bridge gave up: no ride at all.
    user_id: 2
    date: 2026-11-05
    expect:
      - line: '9057'
        board: Székesfehérvár
        alight: Budapest-Kelenföld
        from: '07:41'
        to: '08:22'
        tolerance_min: 6
  - id: train-through-gap-kapolnasnyek
    note: >-
      16 Pro, 2026-11-05: only 1-5 km fixes for the last 21 km. The Z30 to
      Kápolnásnyék (0.84, ride 164) outscored the whole ride (0.76).
    user_id: 2
    date: 2026-11-05
    forbid:
      - line: Z30
        board: Budapest-Kelenföld
        alight: Kápolnásnyék
    expect:
      - line: '9796'
        board: Budapest-Kelenföld
        alight: Székesfehérvár
        from: '17:19'
        to: '17:56'
        tolerance_min: 6
  - id: train-stops-short-of-kelenfold
    note: >-
      16 Pro, 2026-10-30: the 9057 stopped 660 m before the Kelenföld stop and
      the movement window ended there, so no candidate and no ride at all. The
      fixes reached the stop at 08:22:51 (match_late_arrival).
    user_id: 2
    date: 2026-10-30
    expect:
      - line: '9057'
        board: Székesfehérvár
        alight: Budapest-Kelenföld
        from: '07:40'
        to: '08:22'
        tolerance_min: 6
  - id: metro-underground-to-kelenfold
    note: >-
      16 Pro, 2026-11-07: M4 from Keleti; no fix 17:36-17:46 underground, then
      fixes 370 m from the Kelenföld stop (metro radius 120 m). The ride ended
      at Rákóczi tér (ride 172). Skipped once the day's BKK timetable is gone.
    user_id: 2
    date: 2026-11-07
    expect:
      - line: M4
        board: Keleti pályaudvar
        alight: Kelenföld vasútállomás
        from: '17:33'
        to: '17:48'
        tolerance_min: 6
    forbid:
      - line: M4
        board: Keleti pályaudvar
        alight: Rákóczi tér
