# Install: /etc/systemd/system/dawarich-osrm-restore.service.d/custom.conf
# After the OSRM overlays, restore the GTFS/transit + track_pick code from
# /opt/dawarich-custom. The overlay step is "-" so a failure there (it alerts
# Discord itself) does not skip the custom restore.
[Service]
ExecStart=
ExecStart=-/usr/bin/python3 /opt/dawarich-osrm/restore_overlays.py --settle
ExecStart=/usr/bin/python3 /opt/dawarich-custom/restore_custom.py
TimeoutStartSec=90min
