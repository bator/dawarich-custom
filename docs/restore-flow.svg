<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" width="760" height="700" role="img" aria-label="After a community-scripts upgrade replaces the app, the path unit runs the OSRM overlays and then restore_custom.py, which plans a 3-way merge from the repo, refuses on any guard with a Discord alert, otherwise writes with a backup, migrates and precompiles (rolling back on failure), restarts the four services and smoke-checks /transit.">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
    .repo { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.2; }
    .bad { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.2; }
    .t { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .s { fill: #59636e; font-size: 11.5px; }
    .bt { fill: #a40e26; font-size: 12.5px; font-weight: 600; }
    .bs { fill: #82071e; font-size: 11.5px; }
    .rt { fill: #0550ae; font-size: 12.5px; font-weight: 600; }
    .ln { stroke: #59636e; stroke-width: 1.4; fill: none; }
    .lnb { stroke: #cf222e; stroke-width: 1.4; fill: none; }
    .lnr { stroke: #0969da; stroke-width: 1.4; fill: none; }
    .ah { fill: #59636e; }
    .ahb { fill: #cf222e; }
    .ahr { fill: #0969da; }
    .lab { fill: #59636e; font-size: 11px; font-style: italic; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #6e7681; }
      .repo { fill: #0c2d6b; stroke: #4493f8; }
      .bad { fill: #3d1214; stroke: #f85149; }
      .t { fill: #e6edf3; }
      .s, .lab { fill: #9198a1; }
      .bt { fill: #ff7b72; }
      .bs { fill: #ffa198; }
      .rt { fill: #79c0ff; }
      .ln { stroke: #9198a1; }
      .ah { fill: #9198a1; }
      .lnb { stroke: #f85149; }
      .ahb { fill: #f85149; }
      .lnr { stroke: #4493f8; }
      .ahr { fill: #4493f8; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="760" height="700" rx="10"/>

  <!-- main column: x 40..380, centre 210 -->
  <rect class="box" x="40" y="24" width="340" height="52" rx="8"/>
  <text class="t" x="210" y="46" text-anchor="middle">community-scripts upgrade</text>
  <text class="s" x="210" y="64" text-anchor="middle">replaces /opt/dawarich/app wholesale</text>

  <line class="ln" x1="210" y1="76" x2="210" y2="98"/>
  <polygon class="ah" points="205,96 215,96 210,104"/>
  <rect class="box" x="40" y="104" width="340" height="52" rx="8"/>
  <text class="t" x="210" y="126" text-anchor="middle">dawarich-osrm-restore.path → .service</text>
  <text class="s" x="210" y="144" text-anchor="middle">fires when .app_version changes</text>

  <line class="ln" x1="210" y1="156" x2="210" y2="178"/>
  <polygon class="ah" points="205,176 215,176 210,184"/>
  <rect class="box" x="40" y="184" width="340" height="52" rx="8"/>
  <text class="t" x="210" y="206" text-anchor="middle">OSRM overlays</text>
  <text class="s" x="210" y="224" text-anchor="middle">restore_overlays.py (a failure does not stop the chain)</text>

  <line class="ln" x1="210" y1="236" x2="210" y2="258"/>
  <polygon class="ah" points="205,256 215,256 210,264"/>
  <rect class="box" x="40" y="264" width="340" height="62" rx="8"/>
  <text class="t" x="210" y="286" text-anchor="middle">restore_custom.py: plan, no writes</text>
  <text class="s" x="210" y="304" text-anchor="middle">copy files/, 3-way merge each ours/ file</text>
  <text class="s" x="210" y="319" text-anchor="middle">git merge-file ours upstream/&lt;base&gt; &lt;new upstream&gt;</text>

  <!-- repo input -->
  <rect class="repo" x="460" y="264" width="260" height="62" rx="8"/>
  <text class="rt" x="590" y="286" text-anchor="middle">this repo (/opt/dawarich-custom)</text>
  <text class="s" x="590" y="304" text-anchor="middle">files/ · ours/ · upstream/&lt;base&gt;/</text>
  <text class="s" x="590" y="319" text-anchor="middle">manifest.json</text>
  <line class="lnr" x1="460" y1="295" x2="388" y2="295"/>
  <polygon class="ahr" points="390,290 390,300 382,295"/>
  <text class="lab" x="424" y="287" text-anchor="middle">reads</text>

  <!-- guards -->
  <line class="ln" x1="210" y1="326" x2="210" y2="348"/>
  <polygon class="ah" points="205,346 215,346 210,354"/>
  <polygon class="box" points="210,354 330,394 210,434 90,394"/>
  <text class="t" x="210" y="398" text-anchor="middle">guards pass?</text>

  <line class="lnb" x1="330" y1="394" x2="452" y2="394"/>
  <polygon class="ahb" points="450,389 450,399 458,394"/>
  <text class="lab" x="392" y="386" text-anchor="middle">no</text>
  <rect class="bad" x="458" y="357" width="262" height="74" rx="8"/>
  <text class="bt" x="589" y="379" text-anchor="middle">refuse the whole restore</text>
  <text class="bs" x="589" y="397" text-anchor="middle">merge conflict, custom path now</text>
  <text class="bs" x="589" y="411" text-anchor="middle">upstream, or migration version clash</text>
  <text class="bs" x="589" y="425" text-anchor="middle">→ Discord alert, nothing written</text>

  <!-- write -->
  <line class="ln" x1="210" y1="434" x2="210" y2="456"/>
  <polygon class="ah" points="205,454 215,454 210,462"/>
  <text class="lab" x="222" y="450">yes</text>
  <rect class="box" x="40" y="462" width="340" height="62" rx="8"/>
  <text class="t" x="210" y="484" text-anchor="middle">write, with backup</text>
  <text class="s" x="210" y="502" text-anchor="middle">bundle install if Gemfile changed,</text>
  <text class="s" x="210" y="517" text-anchor="middle">db:migrate, assets:precompile</text>

  <line class="lnb" x1="380" y1="493" x2="452" y2="493"/>
  <polygon class="ahb" points="450,488 450,498 458,493"/>
  <text class="lab" x="416" y="485" text-anchor="middle">fails</text>
  <rect class="bad" x="458" y="466" width="262" height="54" rx="8"/>
  <text class="bt" x="589" y="488" text-anchor="middle">roll the files back</text>
  <text class="bs" x="589" y="506" text-anchor="middle">no restart, old app keeps running</text>

  <!-- restart + smoke -->
  <line class="ln" x1="210" y1="524" x2="210" y2="546"/>
  <polygon class="ah" points="205,544 215,544 210,552"/>
  <rect class="box" x="40" y="552" width="340" height="52" rx="8"/>
  <text class="t" x="210" y="574" text-anchor="middle">restart 4 services</text>
  <text class="s" x="210" y="592" text-anchor="middle">web, web-local, worker, gtfs-discord-bot</text>

  <line class="ln" x1="210" y1="604" x2="210" y2="626"/>
  <polygon class="ah" points="205,624 215,624 210,632"/>
  <rect class="box" x="40" y="632" width="340" height="52" rx="8"/>
  <text class="t" x="210" y="654" text-anchor="middle">smoke check</text>
  <text class="s" x="210" y="672" text-anchor="middle">/transit on :3000 and :3002 not 404/5xx, bot active</text>
</svg>
